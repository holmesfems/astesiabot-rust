[package]
name = "astesiabot-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
poise = "0.6"
axum = { version = "0.8", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
fancy-regex = "0.13"
itertools = "0.13"
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
askama = { version = "0.16", features = ["serde_json"] }
tower-http = { version = "0.6", features = ["fs"] }
nalgebra = "0.33"
rand = "0.10"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
rust_xlsxwriter = "0.101.0"
zip = { version = "9", default-features = false }

[dev-dependencies]
calamine = "0.37.0"
tower = { version = "0.5", features = ["util"] }
