# iOS 公開求人ショートカットの最新版情報。
# include_str! でビルド時に埋め込むので、書き換えたら再ビルド＋デプロイが必要。
#
# url: 最新版の iCloud 共有リンク。固定URL GET /shortcut/recruitment がここへ
#      リダイレクトする（トップページのカード・更新通知の文面はこの固定URLを指す。
#      iCloud リンクは共有し直すたびに変わるので、差し替えはここだけで済ませる）
# latest_version: 最新版の番号（整数）。POST /recruitment/ の `shortcutVersion` と比べて
#      - shortcutVersion < latest_version → 応答の `update` に最新版情報を載せる
#      - shortcutVersion 無し（版を送らない旧ショートカット）→ `update` に加えて
#        `reply` の末尾にも通知文を足す（旧ショートカットは `reply` しか表示しないため）
#      0 の間は通知しない（版を送るショートカットの公開前）
# lite_url: Apple Intelligence を使わない版（v2-lite。非対応の旧機種向け）の iCloud 共有リンク。
#      v2 の AI は OCR でタグが4個以下しか読めなかったときのフォールバックなので、無くても精度が少し落ちるだけ。
#      固定URL GET /shortcut/recruitment-lite がここへリダイレクトする。
#      版番号は latest_version と同じものを送る（更新通知を出さないため）
latest_version: 2
url: https://www.icloud.com/shortcuts/512119066af44385b90094b333cc1884
lite_url: https://www.icloud.com/shortcuts/1fa610ad213345bfbe270c411676f5b5
