# CNで公開求人に追加されたオペレーターのJP反映日（手動設定）。
#
# - 対象は「CNの募集可能一覧にあってJPに無い」オペレーター
#   （data/seed/recruit_pool.json の cn_only。起動時と日次更新時に、反映日が未設定のものを
#   ログに出す）。
# - date の RECRUIT_FUTURE_HOUR 時（既定16:00 JST）を過ぎたら、JPのゲームデータに無くても
#   グローバル版のプールとして扱う（データの更新が遅れることがあるため）。
#   日付の前・日付を設定していない間は、大陸版でだけ対象になる。
# - operators は表示名でもCN名でもよい。どちらにも当たらない名前（タイプミス等）が
#   あると cargo test が落ちる。
# - JPのゲームデータが追いついたら、そのオペレーターは自動でJP側に移る。ここに残った行は
#   無視されるので、消しても残してもよい。
# - CNの追加からJPの反映まではここ数回5〜6ヶ月で、CNで一緒に追加された組がそのまま来ている。
# - ビルド時に埋め込む（include_str!）ので、書き換えたら再ビルド・再デプロイが必要。

