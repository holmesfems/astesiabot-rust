#オペレーターの中国語名→日本語名の仮訳フォールバック。
#JP版未実装オペレーターの名前解決に使う(customItemZhToJa.yamlのオペレーター版)。
#JPに実装されたらJPのゲームデータの名前が優先されるので、その行は消してよい。
#手入れが必要になったら cargo test が教えてくれる（operator_data.rs のテスト）:
#  - キーがCNのオペレーター名に無い（誤字）
#  - JP実装済みのオペレーターが残っている（消してよい）
#  - 仮訳の無いCN限定オペレーターがいる（仮訳を追加する。英語名からの仮訳でよい）
#直近実装の判定はこのファイルではなく、JPに初めて現れた日（data/seed/jp_first_seen.json。
#regen_seeds が記録する）から180日以内かどうかで自動で決まる。

