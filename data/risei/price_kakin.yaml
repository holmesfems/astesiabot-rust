# 課金パックの価格表（/riseikakin と GET /api/risei/lists/kakin が読む）。
#
# ---- 編集ルール（AIがメンテする前提）----
# ・このファイルにあるパック = 現在ショップで販売中のパック。販売終了したものは消す
#   （コメントアウトで残さない。過去の内容は git log -p で追える）
# ・パックの内容はユーザーが提示するスクショをそのまま書き写す。過去のパックと
#   似ていても照合・流用はしない（同じ名前・値段でも中身が微妙に違うことがある）
# ・アークナイツ公式サイトはJS描画のSPAで WebFetch/curl では内容を取得できないため参照しない
# ・値段はスクショに無いことが多い。憶測で書かず、ユーザーに確認すること
# ・期間限定パックは isConstant: false。恒常パック（下の #constant）は isConstant: true
# ・全作業の終了を告知されたら、今回のスクショ一式に含まれなかった期間限定パックは
#   種類を問わず（訓練パック系も含む）削除する。#constant は触らない
# ・龍門幣は1000単位で書く（例: 龍門幣×260,000 → 龍門幣1000: 260）
# ・アイテム名は理性価値表の日本語名と完全一致させる。理性価値が0になる名前は
#   cargo test（kakin.rs の every_pack_item_has_risei_value）で落ちる。
#   コスメ（プロファイルアイコン・ホーム背景・テーマ・「伝道師」のようなUIスキン等）のように
#   本当に理性価値0のアイテムは、パックの zeroValue に名前を並べて明示する:
#
#   伝道師パック:
#     price: 650
#     isConstant: false
#     contents:
#       合成玉: 1600
#       伝道師: 1
#     zeroValue: [伝道師]
#
#   テストが落ちたのにコスメでない場合は、名前の誤字か、理性価値表に無いアイテム
#   （data/risei/const_values.yaml への追加が必要）なので、ユーザーに確認すること
# ・期間限定パックは #limited に price 昇順で並べる
# --------------------------------

