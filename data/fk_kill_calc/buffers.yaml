# フレームキル計算機のバフカタログ(P2)。P3で`inspire`(鼓舞ソース)リストを追加。
# P4でconditionalに`source`(ゲームデータからの動的値解決)を追加。P5でindividualにも
# `source`を対応させ、talent×scale/base_pct×scale/stageの3種のソース形状を追加した。
#
# 読み込み方法・スキーマの詳細は`src/engine/fk_kill_calc/buffers.rs`冒頭のコメント、
# 解決アルゴリズムの詳細は`src/engine/fk_kill_calc/conditional_source.rs`冒頭コメントを参照。
# 簡単には:
#   individual: 行ごとにチップで選ぶバフ(自己バフ等)。値は固定(pct/flat)か、
#     ゲームデータからの動的解決(source。P5)のどちらか一方:
#     - { id, name, pct: 0.xx (または flat: 数値。固定値の場合)
#         single_target: true(省略時false)
#         source: { ... } (省略可。P5。下記`source`の形状を参照)
#         toggle: { label: "...", mult: 倍率 } (省略可。P5。例: ステインレスS1の「装置2台」)
#         note }
#   conditional: 全体で1回ON/OFFし、targetsのタグを持つ行にだけ自動で効くバフ。値は
#     固定(pct/flat)か、ゲームデータからの動的解決(source)のどちらか一方:
#     - { id, name, targets: [タグ,...],
#         pct: 0.xx (または flat: 数値。固定値の場合)
#         source: { ... } (省略可。P4。下記`source`の形状を参照)
#         toggle: { label: "...", mult: 倍率 } (省略可。P4。ON/OFFで解決値に倍率を掛ける
#                   単純なトグル。例: 前衛アーミヤの「スキル中は効果2倍」)
#         bonus: { tags: [タグ,...],
#                  pct/flat: 数値 (固定値。旧来の置き換え) または
#                  mult: 倍率 (P4。source付きバフ専用。解決した基本値にこの倍率を掛ける),
#                  note } (省略可。targetsに加えてbonus.tagsのいずれかも持つ行には
#                  基本値の代わりにbonus側の値を使う),
#         note }
#   `source`の形状(individual/conditional共通。次のいずれか1つ):
#     - { operator: <charId>, talent: <talentIndex> (素質由来。0始まり), key: <キー名> }
#         … 素質値そのもの(例: castle3、エクシア)
#     - { operator: <charId>, skill_num: "<fk_dataのskill_num>", key: <キー名> }
#         … スキルLv別blackboardそのもの(例: 血漿、ドリアン、ズィマー、スプリアS2)
#     - { operator, talent: <idx>, key: <キー名>,
#         scale_skill_num: "<skill_num>", scale_key: <キー名> }
#         … 素質値 × スキルLv別スケール(P5。例: スワイヤーS1/S2)
#     - { operator, base_pct: 0.xx, scale_skill_num: "<skill_num>", scale_key: <キー名> }
#         … 固定基礎値(ゲームデータから機械抽出できないトークン等由来) × スキルLv別
#           スケール(P5。例: ステインレスS1)
#     - { operator, stage_skill_id: "<直接指定するskillId>",
#         stage_keys: [キー名,...], stage_labels: [表示ラベル,...] }
#         … スキルLvではなく同一skillのblackboard上の複数キーを離散段階として使う
#           (P5。例: ナスティS3。3要素なら"1段階"〜"3段階")
#     いずれも`max_targets_by_module: { module: <uniEquipId>, min_level: <Lv>, count: <人数> }`
#     (省略可。P5。individual専用の使い方。値の解決には関与せず、指定モジュールLv以上を
#     装備している間だけ`single_target`警告の許容選択数を`count`に緩和する。例: エクシア)
#     を追加で持てる。
#     `source`の値解決(昇進/潜在/モジュール/スキルLvの軸、値が変わらない軸を隠すdedupe等)は
#     全て`build_catalog`(Rust側)が行い、フロントは解決済みの値テーブルを
#     `resolveConditionalValue`(engine.js)で読むだけ。
#   inspire(P3): 鼓舞(インスパイア)ソース。FKする側ではなく「味方に鼓舞バフを撒く側」の
#     オペレーターを表す(fk_dataシートには載らないため、operatorはoperator_combat側の
#     idを直接指す)。スキーマ・値の出典は`src/engine/fk_kill_calc/mod.rs`の
#     `build_inspire_sources`冒頭コメント、および本ファイル末尾の濁心スカジのコメント参照。
#
# targets/bonus.tagsに書けるタグ名は`tags.rs::tag_vocabulary()`の語彙のみ
# (`cargo test`のドリフト検知テスト`buffers.rs::every_target_tag_is_in_the_known_vocabulary`
# が保証する)。固定値(pct/flat)は全てオーナー提供の参照スプレッドシートに基づく(出典:
# 各行のnote参照)。`source`付きの値は`operator_combat`/`skill_data`から機械抽出するため
# ここには数値を書かない(実データ検証結果は各行のnote参照)。

