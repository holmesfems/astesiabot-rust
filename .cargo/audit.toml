# cargo audit の設定（.github/workflows/audit.yml が読む）。
# ignore に足すのは「直す手段がまだ無い」か「このプロジェクトでは届かない経路」だけにして、
# 必ず理由と、外せる条件を書く。条件を満たしたら消す。

[advisories]
ignore = [
    # --- rustls 0.22 / rustls-webpki 0.102 ---
    # serenity 0.12 → tokio-tungstenite 0.21 が Discord の Gateway（WebSocket）につなぐときだけ使う。
    # 修正は rustls 0.23.46 以降にしか無く、serenity を上げないと直らない（serenity は poise に合わせて据え置き）。
    # つなぐ先は Discord だけで、どれも経路上の攻撃者（MITM）か、使っていない機能が前提:
    "RUSTSEC-2026-0346", # rustls: Debug でセッションの秘密が出る（セッションを Debug 表示していない）
    "RUSTSEC-2026-0349", # rustls: ServerHello で耐量子でない鍵交換に落とされる（MITM が前提）
    "RUSTSEC-2026-0049", # webpki: CRL の配布点の扱い（CRL を使っていない）
    "RUSTSEC-2026-0104", # webpki: CRL の解析で panic（CRL を使っていない）
    "RUSTSEC-2026-0098", # webpki: URI 名の名前制約（不正な証明書＋MITM が前提）
    "RUSTSEC-2026-0099", # webpki: ワイルドカードの名前制約（不正な証明書＋MITM が前提）
    "RUSTSEC-2026-0382", # webpki: 失効した中間証明書を受け入れ得る（不正な証明書＋MITM が前提）
    # 外せる条件: poise / serenity が rustls 0.23 系の tungstenite に上がったとき。
]
