# PR と master への push で、clippy・cargo test・verify.mjs を回す。
# 本番（Heroku）と同じ Linux で回す。e2e.mjs は Windows 専用（taskkill / LOCALAPPDATA）なので入れない。
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Heroku のビルドパックもビルドのたびに stable を取るので揃える
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node src/api/lod_chest_solver/verify.mjs
      - run: node src/api/fk_kill_calculator/verify.mjs
      - run: node src/api/ef_recipe_calculator/verify.mjs
      - run: node src/api/wl_battery_simulator/verify.mjs
